name: Publish production image

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Set image metadata
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF" = "refs/heads/production" ]; then
            echo "RELEASE_TAG=production" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=candidate" >> "$GITHUB_ENV"
          fi
          echo "fork-${GITHUB_SHA::12}" > VERSION

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.1'

      - name: Test native funding, scoped integration, and provider errors
        run: |
          go test ./model ./service ./router ./middleware ./dto
          go test ./controller -run MetaLearnSource -count=1
          go test -race ./model ./service ./router ./middleware -run MetaLearn -count=1
          go vet ./model ./service ./router ./middleware

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish summary
        run: |
          echo "### Production image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}:${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}:sha-${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
